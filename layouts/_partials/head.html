<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="{{ .Site.Params.author }}">
  <meta name="description" content="{{ .Site.Params.description }}">
<!-- Google Fonts Embed Codes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fanwood+Text:ital@0;1&family=Goudy+Bookletter+1911&display=swap" rel="stylesheet">
  {{ $css := slice
    (resources.Get "css/theme.css")
    (resources.Get "css/base.css")
    (resources.Get "css/components.css")
    | resources.Concat "css/style.css"
    | resources.Minify
  }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <link href="https://cdn.jsdelivr.net" rel="stylesheet" integrity="sha384-0RonC0dLRk3PzO8BwufXG1yYdWAw3Z5UUZrz/fQ4bVP5b+3aV5d+/bXyQ+J5y+s" crossorigin="anonymous">
  <script src="/js/theme.js" defer></script>
  <link rel="icon" href="/favicon/favicon.ico" type="icon" />
  {{ partial "opengraph.html" . }}
  <meta name="google-site-verification" content="j--yVzABLAs2DIkt6otCBEUa-Vt54_hgfBatrUxGrGM" />
</head>
